apiVersion: 1
providers:
  - name: grss-veda-provisioned
    type: file
    folder: GRSS-VEDA
    # Edits happen in this repo, not the UI, so git stays the source of truth
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      # Matches GF_PATHS_PROVISIONING set in grafana/Dockerfile
      path: /usr/local/grafana/provisioning/dashboards
